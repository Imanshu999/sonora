name: Build Sonora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci
  JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.0/x64

jobs:
  build:
    name: Build Sonora Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Show build environment
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Create local.properties
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare Gradle
        shell: bash
        run: |
          rm -rf .gradle
          rm -rf .gradle-ci
          rm -rf app/build
          mkdir -p .gradle-ci

      - name: Build Sonora APK
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Dorg.gradle.configuration-cache=false -Dorg.gradle.caching=false -Dorg.gradle.vfs.watch=false"
        run: |
          gradle :app:clean \
            --no-daemon \
            --no-parallel \
            --no-configuration-cache \
            --no-build-cache \
            --no-watch-fs \
            --max-workers=1 \
            --console=plain

          gradle :app:assembleDebug \
            --no-daemon \
            --no-parallel \
            --no-configuration-cache \
            --no-build-cache \
            --no-watch-fs \
            --max-workers=1 \
            --rerun-tasks \
            --stacktrace \
            --info \
            --console=plain

      - name: Find generated APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find app/build -type f -name "*.apk" -print

          APK="$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"
          ls -lh "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifacts

          APK="$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)"

          cp "$APK" "artifacts/Sonora-debug.apk"

          ls -lh artifacts/Sonora-debug.apk

      - name: Package clean source ZIP
        shell: bash
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/Sonora-clean-source.zip HEAD -- . ':(exclude)README.md' ':(exclude)docs/screenshots' ':(exclude)docs/screenshots/*'
          ls -lh artifacts/Sonora-clean-source.zip

      - name: Upload clean source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-clean-source-ZIP
          path: artifacts/Sonora-clean-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Sonora APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-debug-APK
          path: artifacts/Sonora-debug.apk
          if-no-files-found: error
          retention-days: 30

