name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Sonora APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Your repository's gradlew is only a shim and does not
      # contain a real Gradle wrapper. Install the exact version
      # declared by the project instead.
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      # app/build.gradle.kts expects this file for debug builds.
      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Clean project
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        run: |
          echo "APK files generated:"
          find . -type f -path '*/build/outputs/apk/*.apk' -print

          APK_COUNT=$(find . -type f -path '*/build/outputs/apk/*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Sonora-debug-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 30
