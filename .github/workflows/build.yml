Name: Build Sonora APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build Sonora APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Show versions
        run: |
          java -version
          gradle --version

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace \
            --max-workers=2

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            --warning-mode all

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          echo "Searching for APK..."

          find . \
            -type f \
            -path '*/build/outputs/apk/*.apk' \
            -print

          APK=$(find . \
            -type f \
            -path '*/build/outputs/apk/*.apk' \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            echo "Build output directories:"
            find . -type d -name outputs -print
            exit 1
          fi

          echo "Found APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Copy APK
        shell: bash
        run: |
          mkdir -p artifacts

          cp "${{ steps.apk.outputs.apk_path }}" \
             "artifacts/Sonora-debug.apk"

          ls -lh artifacts/Sonora-debug.apk

      - name: Upload Sonora APK
        uses: actions/upload-artifact@v6
        with:
          name: Sonora-debug-APK
          path: artifacts/Sonora-debug.apk
          if-no-files-found: error
          retention-days: 30
